name: Build OpenWrt H660GM-A

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          repository: 'naseef/openwrt'
          ref: 'H660GM-A'
          fetch-depth: 0

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            gawk \
            gcc-multilib \
            g++-multilib \
            gettext \
            git \
            libncurses5-dev \
            libssl-dev \
            python3 \
            python3-distutils \
            rsync \
            unzip \
            zlib1g-dev \
            file \
            wget \
            subversion \
            swig \
            time

      - name: Update & Install Feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure Target
        run: |
          echo "CONFIG_TARGET_econet=y" > .config
          echo "CONFIG_TARGET_econet_en7528=y" >> .config
          echo "CONFIG_TARGET_econet_en7528_DEVICE_dasan_h660gm-a-airtel=y" >> .config

          make defconfig

          echo "=== Target Configuration ==="
          grep -E "CONFIG_TARGET_(econet|.*DEVICE)" .config

      - name: Download Sources
        run: |
          make download -j$(nproc)

      - name: Compile Firmware
        run: |
          make -j$(nproc) || make -j1 V=s

      - name: List Firmware
        if: always()
        run: |
          find bin/targets/econet/en7528 -type f -print

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: H660GM-A-Firmware
          path: |
            bin/targets/econet/en7528/*
